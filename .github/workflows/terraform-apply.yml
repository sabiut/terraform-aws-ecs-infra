name: 'Terraform Apply'

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  TERRAFORM_VERSION: '1.5.7'
  WORKING_DIR: './terraform'
  AWS_REGION: 'ap-southeast-2'
  # Terraform reads TF_VAR_environment as var.environment, so each workspace
  # deploys under its own name instead of every workspace deploying as "dev".
  TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}

permissions:
  contents: read
  id-token: write
  deployments: write

# One apply or destroy at a time per environment. Terraform's state lock would
# make a second run fail anyway; queueing it is friendlier.
concurrency:
  group: terraform-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: github-actions-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform Init
      id: init
      run: |
        terraform init -input=false -lockfile=readonly \
          -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}" \
          -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE || 'terraform-state-locks' }}" \
          -backend-config="encrypt=true"
      working-directory: ${{ env.WORKING_DIR }}

    - name: Select Workspace
      run: |
        terraform workspace select ${{ github.event.inputs.environment || 'dev' }} || terraform workspace new ${{ github.event.inputs.environment || 'dev' }}
      working-directory: ${{ env.WORKING_DIR }}

    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color -out=tfplan
      working-directory: ${{ env.WORKING_DIR }}

    - name: Terraform Apply
      id: apply
      run: terraform apply -auto-approve tfplan
      working-directory: ${{ env.WORKING_DIR }}

    - name: Terraform Output
      id: output
      run: |
        echo "### Deployment Outputs" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        terraform output -json | jq -r 'to_entries[] | select(.value.sensitive | not) | "\(.key): \(.value.value)"' >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "alb_url=http://$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT
      working-directory: ${{ env.WORKING_DIR }}

    - name: Create GitHub Deployment
      uses: chrnorm/deployment-action@v2
      with:
        token: '${{ github.token }}'
        environment-url: ${{ steps.output.outputs.alb_url }}
        environment: ${{ github.event.inputs.environment || 'dev' }}
        initial-status: success
        description: 'Terraform Apply Completed'